<div class="container mt-4">
  <h1>Shipping</h1>
  <div class="row">
    <div class="col-md-6">
      <form #f="ngForm">
        <div class="mb-3">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" ngModel class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="addressLine1">Address</label>
          <input type="text" id="addressLine1" name="addressLine1" ngModel class="form-control" placeholder="Line 1" required>
        </div>
        <div class="mb-3">
          <input type="text" id="addressLine2" name="addressLine2" ngModel class="form-control" placeholder="Line 2">
        </div>
        <div class="mb-3">
          <label for="city">City</label>
          <input type="text" id="city" name="city" ngModel class="form-control" required>
        </div>
        <button
        type = "button"
        [disabled]="!f.valid"
        (click)="placeOrder()"
        class="btn-place-order">
        Place Order
      </button>
      </form>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title h4">Order Summary</h3>
          <p class="text-muted">You have {{ totalCount }} items in your shopping cart.</p>

          <ul class="list-group list-group-flush mb-3">
            <li *ngFor="let item of cartItems" class="list-group-item d-flex justify-content-between align-items-center border-0 px-0">
              <span>{{ item.quantity }} x {{ item.product.title }}</span>
              <span>{{ (item.product.price * item.quantity) | currency:'USD' }}</span>
            </li>

            <li class="list-group-item d-flex justify-content-between align-items-center border-top px-0 pt-3 fw-bold">
              <span>Total</span>
              <span>{{ totalPrice | currency:'USD' }}</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
