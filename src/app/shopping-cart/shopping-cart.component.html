<div class="container mt-5">
  <div class="row d-flex align-items-center">
    <div class="col">
      <h1>Shopping Cart</h1>
      <p class="text-secondary">You have {{ totalItemsCount }} items in your shopping cart.</p>
    </div>
    <div class="col-auto">
      <button
        (click)="clearCart()"
        *ngIf="totalItemsCount > 0"
        class="btn btn-outline-danger btn-sm">Clear Shopping Cart</button>
    </div>
  </div>

  <ng-container *ngIf="totalItemsCount > 0; else emptyCart">
    <table class="table table-striped table-hover align-middle mt-4">
      <thead>
        <tr>
          <th></th> <!-- Column for Image -->
          <th>Product</th>
          <th class="text-center" style="width: 230px">Quantity</th>
          <th class="text-end" style="width: 130px">Price</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items">
          <td>
            <!-- Added the product image as shown in screenshot -->
            <img [src]="item.product.imageUrl || 'assets/images/placeholder.png'"
                 class="img-thumbnail rounded-circle shadow-sm"
                 style="width: 80px; height: 80px; object-fit: cover;"
                 [alt]="item.product.title">
          </td>
          <td class="font-weight-bold">{{ item.product.title }}</td>
          <td class="text-center">
            <div class="row align-items-center justify-content-center">
              <div class="col-auto p-0">
                <button (click)="removeFromCart(item.product)" class="btn btn-secondary btn-sm rounded-circle">-</button>
              </div>
              <div class="col-auto mx-2 font-weight-bold">
                {{ item.quantity }} <span class="text-secondary font-weight-light">in cart</span>
              </div>
              <div class="col-auto p-0">
                <button (click)="addToCart(item.product)" class="btn btn-secondary btn-sm rounded-circle">+</button>
              </div>
            </div>
          </td>
          <td class="text-end font-weight-bold">
            {{ (item.product.price * item.quantity) | currency:'USD' }}
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th></th>
          <th>Total</th>
          <th></th>
          <th class="text-end font-size-lg">{{ totalPrice | currency:'USD' }}</th>
        </tr>
      </tfoot>
    </table>

    <!-- "Check Out" button which links to the check-out page -->
    <a routerLink="/check-out" class="btn btn-primary mt-4">Check Out</a>
  </ng-container>

  <ng-template #emptyCart>
    <div class="alert alert-warning mt-4 text-center">
      <i class="fa-solid fa-circle-exclamation me-2"></i> Your shopping cart is empty.
    </div>
  </ng-template>
</div>
