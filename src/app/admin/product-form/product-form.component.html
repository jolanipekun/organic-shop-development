<div class="container pt-5">
  <div class="row">
    <div class="col-md-6">
      <form #f="ngForm" (ngSubmit)="save(f.value)">
        <div class="mb-3">
          <label for="title">Title</label>
          <input ngModel name="title" id="title" type="text" class="form-control">
        </div>
        <div class="mb-3">
          <label for="price">Price</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input ngModel name="price" id="price" type="number" class="form-control">
          </div>
        </div>
        <div class="mb-3">
          <label for="category">Category</label>
          <select ngModel name="category" id="category" class="form-control">
            <option value=""></option>
            <option *ngFor="let c of categories$ | async" [value]="c.key">
              {{ c.name }}
            </option>
          </select>
        </div>
        <div class="mb-3">
          <label for="imageUrl">Image URL</label>
          <input ngModel name="imageUrl" #imageUrl="ngModel" id="imageUrl" type="text" class="form-control">
        </div>
        <button class="btn btn-primary">Save</button>
      </form>
    </div>

    <!-- Live Preview Card -->
    <div class="col-md-6">
      <div class="card" style="width: 20rem;">
        <img [src]="imageUrl.value" class="card-img-top" *ngIf="imageUrl.value">
        <div class="card-body">
          <h5 class="card-title">{{ f.value.title }}</h5>
          <p class="card-text">{{ f.value.price | currency:'USD' }}</p>
        </div>
      </div>
    </div>
    <button (click)="addToCart(f.value)" type="button" class="btn btn-primary">Add to Cart</button>
  </div>
</div>
