<div class="row mt-5">
  <div class="col-md-6">
    <form #f="ngForm" (ngSubmit)="save(f.value)">
      <div class="mb-3">
        <label for="title">Title</label>
        <input #title="ngModel" [(ngModel)]="product.title" name="title" id="title" type="text" class="form-control" required>
        <div class="alert alert-danger" *ngIf="title.touched && title.invalid">Title is required.</div>
      </div>

      <div class="mb-3">
        <label for="price">Price</label>
        <div class="input-group">
          <span class="input-group-text">$</span>
          <input #price="ngModel" [(ngModel)]="product.price" name="price" id="price" type="number" class="form-control" required [min]="0">
        </div>
        <div class="alert alert-danger" *ngIf="price.touched && price.invalid">
            <span *ngIf="price.errors?.['required']">Price is required.</span>
            <span *ngIf="price.errors?.['min']">Price should be 0 or higher.</span>
        </div>
      </div>

      <div class="mb-3">
        <label for="category">Category</label>
        <select #category="ngModel" [(ngModel)]="product.category" name="category" id="category" class="form-select" required>
          <option value=""></option>
          <option value="bread">Bread</option>
          <option value="dairy">Dairy</option>
          <option value="fruits">Fruits</option>
          <option value="vegetables">Vegetables</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="imageUrl">Image URL</label>
        <input #imageUrl="ngModel" [(ngModel)]="product.imageUrl" name="imageUrl" id="imageUrl" type="text" class="form-control" required>
      </div>

      <div class="mt-4">
        <button [disabled]="!f.valid" class="btn btn-primary me-2">Save</button>
        <button *ngIf="id" type="button" (click)="delete()" class="btn btn-danger">Delete</button>
      </div>
    </form>
  </div>

  <div class="col-md-6">
    <div class="card shadow-sm sticky-top" style="top: 20px; width: 18rem;">
      <img *ngIf="product.imageUrl" [src]="product.imageUrl" class="card-img-top" alt="Product Image">
      <div class="card-body">
        <h5 class="card-title">{{ product.title }}</h5>
        <p class="card-text">{{ product.price | currency:'USD' }}</p>
      </div>
    </div>
  </div>
</div>
